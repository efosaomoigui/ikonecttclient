<!DOCTYPE html>
<html lang="en-NG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ikonectt</title>
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#fff;--tint:#fff1f2;--text:#1b0f11;--muted:#6b5a5d;--line:#eadcde;--card:#fff;--red:#e1102d;--red-d:#b60c23;--ink:#14080b;--font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12070a;--tint:#1d0c10;--text:#f6f1f1;--muted:#b3a3a6;--line:rgba(246,241,241,.14);--card:#1a0b0f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12070a;--tint:#1d0c10;--text:#f6f1f1;--muted:#b3a3a6;--line:rgba(246,241,241,.14);--card:#1a0b0f;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.55 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{max-width:74rem;margin:0 auto;padding:0 clamp(1.25rem,4vw,2.5rem)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:.8rem 1.5rem;border-radius:999px;font:600 .9rem/1 var(--font);border:1.5px solid transparent;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.btn.red{background:var(--red);color:#fff}.btn.red:hover{background:var(--red-d)}
.btn.line{border-color:rgba(255,255,255,.55);color:#fff}.btn.line:hover{background:#fff;color:var(--ink)}
.btn.out{border-color:var(--line);color:var(--text)}.btn.out:hover{border-color:var(--red);color:var(--red)}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;height:4rem}
.logo{font-weight:800;font-size:1.5rem;letter-spacing:-.03em;color:var(--red)}
.links{display:flex;gap:1.75rem;font-size:.88rem;font-weight:500;color:var(--muted)}
.links a:hover,.links a.on{color:var(--red)}
.menu{display:none}
.mark{display:block;width:2.2rem;height:3px;background:var(--red);margin-bottom:1rem}
.phero{position:relative;background:var(--ink);color:#fff;padding:4rem 0 3.5rem;overflow:hidden;isolation:isolate;background-image:radial-gradient(55% 120% at 85% 30%,#7d1022,transparent 70%)}
.phero svg{position:absolute;right:0;top:0;height:100%;width:55%;z-index:-1;opacity:.8}
h1{font-weight:800;font-size:clamp(1.9rem,4.2vw,3rem);line-height:1.08;letter-spacing:-.025em;max-width:34rem}
.lead{margin:1rem 0 1.75rem;max-width:30rem;color:#f2dcdf}
.row{display:flex;flex-wrap:wrap;gap:.8rem}
.subnav{display:flex;gap:.5rem;flex-wrap:wrap;padding:1.25rem 0;border-bottom:1px solid var(--line)}
.subnav a{padding:.5rem 1rem;border-radius:999px;font-size:.85rem;font-weight:600;color:var(--muted);border:1px solid var(--line)}
.subnav a.on,.subnav a:hover{background:var(--red);border-color:var(--red);color:#fff}
.sec{padding:3.5rem 0}.sec.tint{background:var(--tint)}
h2{font-weight:800;font-size:clamp(1.4rem,2.6vw,2rem);line-height:1.15;letter-spacing:-.02em}
.sub{color:var(--muted);margin-top:.6rem;max-width:34rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem;margin-top:1.75rem}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.4rem;transition:border-color .2s,transform .2s}
.tile:hover{border-color:var(--red);transform:translateY(-2px)}
.tile h3{font-size:1.02rem;font-weight:800}.tile p{color:var(--muted);font-size:.92rem;margin-top:.4rem}
.demo{font-size:.75rem;font-weight:600;color:var(--red);background:var(--tint);padding:.25rem .65rem;border-radius:999px;margin-left:.6rem;vertical-align:middle}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:1rem;margin-top:1.75rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card i{height:5rem;background:linear-gradient(135deg,#7a1523,#260a10)}
.card:nth-child(2) i{background:linear-gradient(135deg,#e1102d,#4a0f19)}
.card:nth-child(3) i{background:linear-gradient(135deg,#5b1f6e,#1a0a22)}
.card div{padding:1.1rem;display:flex;flex-direction:column;gap:.3rem;flex:1}
.card h3{font-size:1rem;font-weight:800}.card p{font-size:.88rem;color:var(--muted)}.card p:last-of-type{flex:1;margin-bottom:.7rem}
.card .btn{border-radius:8px;padding:.65rem 1rem}
.note{font-size:.85rem;color:var(--muted);margin-top:1.25rem}
.formbox{display:grid;grid-template-columns:1fr 1fr;gap:1rem 1.25rem;margin-top:1.75rem;max-width:46rem}
label{display:flex;flex-direction:column;gap:.35rem;font-size:.88rem;font-weight:600}
label small{font-weight:400;color:var(--muted);font-size:.78rem}
label.full{grid-column:1/-1}
input,select,textarea{font:400 .95rem var(--font);color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.75rem .9rem;width:100%}
textarea{min-height:7rem;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);outline-offset:1px;border-color:transparent}
.formbox .btn{grid-column:1/-1;justify-self:start}
.status{grid-column:1/-1;font-size:.9rem;color:var(--muted);min-height:1.3em}
.status.err{color:var(--red)}
.result{margin-top:1.5rem;max-width:46rem;padding:1.5rem;border:1px solid var(--red);border-radius:12px;background:var(--tint)}
.result h3{font-weight:800;margin-bottom:.3rem}.result .row{margin-top:1rem}
details{border-bottom:1px solid var(--line);max-width:46rem}
summary{cursor:pointer;padding:1.1rem 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:1rem}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--red);font-weight:800}
details[open] summary::after{content:"–"}
details p{padding:0 0 1.2rem;color:var(--muted)}
.legal-box{margin-top:1.75rem;padding:1.5rem;border:1px dashed var(--line);border-radius:12px;color:var(--muted);max-width:46rem}
.cta{background:var(--ink);color:#fff;padding:3.5rem 0}
.cta p{color:#e5d3d6;margin:.7rem 0 1.5rem}
footer{background:var(--ink);color:#bfaeb1;padding:3rem 0 calc(env(safe-area-inset-bottom,0px) + 1.75rem);font-size:.9rem;border-top:1px solid rgba(255,255,255,.1)}
.foot{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:2rem}
.foot nav{display:flex;flex-direction:column;gap:.55rem}.foot strong{color:#fff;font-weight:600;margin-bottom:.3rem}.foot a:hover{color:#fff}
.legal{margin-top:2rem;padding-top:1.25rem;border-top:1px solid rgba(255,255,255,.12);font-size:.82rem}
@media (max-width:900px){
 .links,header .bar>.btn{display:none}
 .menu{display:block;position:relative}.menu summary{padding:0;font-size:.9rem}.menu summary::after{content:none}
 .menu div{position:absolute;right:0;top:2.2rem;min-width:13rem;display:flex;flex-direction:column;gap:.9rem;padding:1.1rem 1.3rem;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
 .phero svg{width:100%;opacity:.4}.foot{grid-template-columns:1fr 1fr}.formbox{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.btn,.tile{transition:none}html{scroll-behavior:auto}}
</style>
