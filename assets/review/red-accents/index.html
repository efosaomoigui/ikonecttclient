<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ikonectt — local image review</title><style>
*{box-sizing:border-box}body{margin:0;font:16px/1.6 system-ui,sans-serif;color:#24272c;background:#f4f5f6}main{max-width:1440px;margin:auto;padding:32px 24px 64px}h1{font-size:32px;margin:0 0 8px}h2{margin:32px 0 16px;font-size:24px}p{margin:0 0 20px;color:#5d646f}a{color:#c30d18}nav{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:24px}label{display:inline-flex;align-items:center;gap:10px;min-height:44px;margin-bottom:12px}input{accent-color:#d90e18;width:18px;height:18px}iframe{display:block;width:100%;height:850px;border:1px solid #d7dbe0;background:#17222e}.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0;background:#fff}img{display:block;width:100%;height:auto}figcaption{padding:14px 20px;font-size:14px;color:#5d646f}@media(max-width:700px){main{padding:24px 16px}.pair{grid-template-columns:1fr}iframe{height:900px}h1{font-size:27px}}
</style></head><body><main>
<h1>Local image review</h1><p>Option E hero placement and Option A photography variants. Nothing has been published.</p>
<nav><a href="/public_html/option-e/#/home" target="_blank">Open Option E</a><a href="/public_html/option-a/#/home" target="_blank">Open Option A</a><a href="/public_html/option-a/#/residential" target="_blank">A Residential</a></nav>
<h2>Option E — photographic city and signals</h2><label><input id="show-city" type="checkbox" checked> Show network signals</label>
<iframe id="hero" src="/public_html/option-e/?production-preview#/home" title="Option E hero comparison"></iframe>
<h2>Option A — family panel</h2><div class="pair"><figure><img src="/public_html/option-a/images/template-a/a-h02-connected-family-medium-v1-1448.webp" alt="Original family room photograph"><figcaption>Original photograph</figcaption></figure><figure><img src="../../visual-library/red-accents/family-red-sofa-v1-1448.webp" alt="Family on a red woven sofa"><figcaption>Red sofa and cushion, with the same room composition</figcaption></figure></div>
<h2>Option A — business panel</h2><div class="pair"><figure><img src="/public_html/option-a/images/template-a/a-h03-business-collaboration-desktop-v3-1672.webp" alt="Original professionals in an office"><figcaption>Original photograph</figcaption></figure><figure><img src="../../visual-library/red-accents/business-red-details-v1-1672.webp" alt="Professionals with small red screen and phone details"><figcaption>Small red accents on the shared screen and phone case</figcaption></figure></div>
<h2>Option A — residential family</h2><div class="pair"><figure><img src="../../visual-library/campaign/client-family-scene-v2-640.webp" alt="Original campaign family on a neutral sofa"><figcaption>Original campaign room</figcaption></figure><figure><img src="../../visual-library/red-accents/campaign-family-red-sofa-v1-640.webp" alt="Campaign family on a red fabric sofa"><figcaption>Red upholstery variant; E retains its existing image</figcaption></figure></div>
</main><script>
const checkbox=document.querySelector('#show-city'),frame=document.querySelector('#hero');let resume=false;
checkbox.addEventListener('change',()=>{const doc=frame.contentDocument,field=doc?.querySelector('.e-city-field'),pause=doc?.querySelector('.e-city-pause');if(!field)return;field.style.visibility=checkbox.checked?'':'hidden';if(!checkbox.checked){resume=pause?.getAttribute('aria-pressed')==='false';if(resume)pause.click();}else if(resume&&pause?.getAttribute('aria-pressed')==='true'){pause.click();resume=false;}});
</script></body></html>
