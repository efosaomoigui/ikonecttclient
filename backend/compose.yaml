services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ikonectt
      POSTGRES_USER: ikonectt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ikonectt -d ikonectt"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
